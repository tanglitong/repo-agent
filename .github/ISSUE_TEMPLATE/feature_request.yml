name: 功能建议
description: 建议新的能力或行为改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际使用场景和当前限制
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、输入输出和边界
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: clients
    attributes:
      label: 影响的客户端
      multiple: true
      options:
        - Codex
        - Claude Code
        - OpenCode
        - 与客户端无关
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不会要求 repo-agent 修改 AGENTS.md 或 CLAUDE.md
          required: true
