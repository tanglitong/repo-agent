name: 跨平台持续集成

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 18
          - 20
          - 22

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行类型检查和测试
        run: npm test

      - name: 构建离线包
        run: npm run package:offline

      - name: 验证离线包存在
        shell: pwsh
        run: |
          if (-not (Test-Path "release/repo-agent-node-offline.zip")) {
            throw "未生成离线包"
          }

      - name: Windows 原生离线包冒烟测试
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

      - name: 上传离线包
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: repo-agent-${{ matrix.os }}
          path: release/repo-agent-node-offline.zip
